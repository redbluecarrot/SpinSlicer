[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spinslicer"
version = "0.6.1"
description = "Open-source CAL slicer: projector frames, virtual print and projector output for Computed Axial Lithography (tomographic volumetric 3D printing)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "redbluecarrot" }, { name = "v0xeII" }]
keywords = [
    "computed axial lithography",
    "CAL",
    "volumetric additive manufacturing",
    "VAM",
    "volumetric 3D printing",
    "tomographic printing",
    "slicer",
    "photopolymer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "PyQt6==6.11.0",
    "pyqtdarktheme==0.1.7",
    "pyvista==0.48.4",
    "pyvistaqt==0.13.0",
    "numpy==2.5.2",
    "scipy==1.18.1",
    "Pillow==12.3.0",
    "trimesh[easy]==5.1.0",
    "scikit-image==0.26.0",
    "opencv-python-headless==5.0.0.93",
    "matplotlib==3.11.1",
    "imageio-ffmpeg==0.7.0",
]

[project.optional-dependencies]
# Finds SpinPrinters by mDNS (_spinprinter._tcp); without it an address typed by hand works.
network = ["zeroconf>=0.130"]

[project.urls]
Homepage = "https://redbluecarrot.github.io/SpinSlicer/"
Source = "https://github.com/redbluecarrot/SpinSlicer"
Releases = "https://github.com/redbluecarrot/SpinSlicer/releases"
Issues = "https://github.com/redbluecarrot/SpinSlicer/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E402", "F601", "F841", "W291"]

[tool.mypy]
python_version = "3.12"
files = ["spinslicer"]
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
no_implicit_optional = true
