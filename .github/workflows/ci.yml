name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies for Qt and OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libglib2.0-0
      - name: Install runtime and development dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
