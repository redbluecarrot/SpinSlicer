name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            archive: SpinSlicer-windows-x64.zip
          - platform: linux-x64
            os: ubuntu-latest
            archive: SpinSlicer-linux-x64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.2

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --distpath dist `
            --workpath build\SpinSlicer `
            packaging\SpinSlicer.spec

      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --distpath dist
          --workpath build/SpinSlicer
          packaging/SpinSlicer.spec

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libegl1 libgl1 \
            libxkbcommon-x11-0 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Check packaged Windows application
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYVISTA_OFF_SCREEN: 'true'
        run: |
          $check = Start-Process -FilePath dist\SpinSlicer.exe -ArgumentList @('--self-check', 'build/self-check') -WindowStyle Hidden -PassThru -Wait
          if ($check.ExitCode -ne 0) { throw "Packaged application failed: $($check.ExitCode)" }
          $report = Get-Content build/self-check/self-check.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Packaged application check did not pass' }

      - name: Check packaged Linux application
        if: runner.os == 'Linux'
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          PYVISTA_OFF_SCREEN: 'true'
        run: |
          dist/SpinSlicer --self-check build/self-check
          python -c "import json; assert json.load(open('build/self-check/self-check.json'))['ok']"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\SpinSlicer.exe -DestinationPath ${{ matrix.archive }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress --yes
          }

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $releaseVersion = $env:RELEASE_VERSION -replace '^v', ''
          if ($releaseVersion -notmatch '^(\d+\.\d+\.\d+)') {
            $appVersion = '0.1.1'
            $releaseVersion = $appVersion
          } else {
            $appVersion = $Matches[1]
          }
          $releaseVersion = $releaseVersion -replace '[^0-9A-Za-z._+-]', '.'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $iscc = @(
            (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) {
            throw 'Inno Setup compiler (ISCC.exe) was not found'
          }
          & $iscc "/DMyAppVersion=$appVersion" "/DMyAppRelease=$releaseVersion" /Orelease-assets packaging\SpinSlicer.iss
          $installer = "release-assets\SpinSlicer-Setup-$releaseVersion.exe"
          if (-not (Test-Path $installer)) {
            throw "Inno Setup did not produce $installer"
          }

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C dist SpinSlicer

      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          OUTPUT_DIR: release-assets
        run: bash packaging/build_linux_packages.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpinSlicer-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: SpinSlicer-windows-executable
          path: dist/SpinSlicer.exe
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: SpinSlicer-windows-installer
          path: release-assets/SpinSlicer-Setup-*.exe
          if-no-files-found: error

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: SpinSlicer-linux-packages
          path: |
            release-assets/*.deb
            release-assets/*.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: SpinSlicer-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          name: SpinSlicer ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
